# Squirrel 皮肤 / 配色补丁
#
# ⚠️ 重要：*.custom.yaml 是「补丁文件」，Rime 只读取文件里的 patch: 节点。
#    如果最外层没有 patch:，整个文件会被静默忽略（不会报错，但完全无效）。
#    可在部署后这样自检：
#      grep -n "macos_native" ~/Library/Rime/build/squirrel.yaml
#    有输出才说明补丁真的生效了。
#
# 颜色格式：0xBBGGRR（BGR 顺序，不是 0xRRGGBB）
patch:
  # ---------------------------------------------------------------
  # 外观：逐项用 "style/xxx" 覆盖，避免整个 style 节点被替换
  # ---------------------------------------------------------------
  "style/color_scheme": macos_native_light
  "style/color_scheme_dark": macos_native_dark

  # 候选框与文字的排列方式
  "style/candidate_list_layout": linear    # stacked | linear
  "style/text_orientation": horizontal     # horizontal | vertical
  # 拼音或词句是否显示在键入位置
  "style/inline_preedit": true             # true | false
  "style/inline_candidate": false          # true | false

  "style/memorize_size": true
  "style/mutual_exclusive": false
  "style/translucency": false
  "style/show_paging": false

  "style/corner_radius": 7
  "style/hilited_corner_radius": 0
  "style/border_height": -2
  "style/border_width": -2
  "style/line_spacing": 5
  "style/spacing": 8
  "style/shadow_size": 0

  "style/candidate_format": "[label]. [candidate] [comment]"
  "style/font_face": Avenir
  "style/font_point": 16

  # ---------------------------------------------------------------
  # 皮肤列表：只新增这两套，其它内置配色保持不变
  # ---------------------------------------------------------------
  # macOS Native Light / 原生质感·日间
  "preset_color_schemes/macos_native_light":
    name: "原生日间 / macOS Native Light"
    author: Gemini / Custom
    font_face: ""                       # 留空使用系统回退，完美支持彩色 Emoji
    font_point: 16
    label_font_face: ".AppleSystemUIFont"
    label_font_point: 14
    comment_font_face: ".AppleSystemUIFont"
    comment_font_point: 16

    inline_preedit: true
    inline_candidate: false
    translucency: true                  # 磨砂半透明
    mutual_exclusive: false
    border_height: 0
    border_width: 0
    corner_radius: 5
    hilited_corner_radius: 5
    shadow_size: 10
    line_spacing: 6
    base_offset: 0
    alpha: 0.95
    spacing: 10
    color_space: display_p3

    # --- 色彩定义 (0xBBGGRR) ---
    back_color: 0xFFFFFF                # 纯白背景（配合磨砂呈灰白）
    border_color: 0xFFFFFF              # 边框同色，隐藏线条

    hilited_candidate_back_color: 0xFF7A00   # macOS 系统蓝 RGB(0,122,255)

    label_color: 0x999999
    hilited_candidate_label_color: 0xFFFFFF

    candidate_text_color: 0x222222
    hilited_candidate_text_color: 0xFFFFFF

    comment_text_color: 0x999999
    hilited_comment_text_color: 0xDDDDDD

    text_color: 0x424242
    hilited_text_color: 0x000000

  # macOS Native Dark / 原生质感·夜间
  "preset_color_schemes/macos_native_dark":
    name: "原生夜间 / macOS Native Dark"
    author: Gemini / Custom
    font_face: ""
    font_point: 16
    label_font_face: ".AppleSystemUIFont"
    label_font_point: 14
    comment_font_face: ".AppleSystemUIFont"
    comment_font_point: 16

    inline_preedit: true
    inline_candidate: false
    translucency: true
    border_height: 0
    border_width: 0
    corner_radius: 5
    hilited_corner_radius: 5
    shadow_size: 10
    line_spacing: 6
    alpha: 0.90
    spacing: 10
    color_space: display_p3

    # --- 色彩定义 (0xBBGGRR) ---
    back_color: 0x262626                # 深空灰
    border_color: 0x000000

    hilited_candidate_back_color: 0xFF7A00

    label_color: 0x888888
    hilited_candidate_label_color: 0xFFFFFF

    candidate_text_color: 0xEEEEEE
    hilited_candidate_text_color: 0xFFFFFF

    comment_text_color: 0x808080
    hilited_comment_text_color: 0xDDDDDD

    text_color: 0x808080
    hilited_text_color: 0xEEEEEE
